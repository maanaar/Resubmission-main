<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Resubmission Copilot" }}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:      #1a6b8a;
      --accent:       #24a6c7;
      --dark:         #0d4f6b;
      --bg:           #f0f5f9;
      --light-blue:   #e3f2f9;
      --card-shadow:  0 4px 16px rgba(26,107,138,0.10);
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    header {
      background: linear-gradient(135deg, #0d4f6b 0%, #1a6b8a 60%, #24a6c7 100%);
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
      padding: 14px 24px;
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-decoration: none;
    }

    .header-brand i {
      font-size: 1.4rem;
      color: #7cdff5;
    }

    .header-divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.25);
      margin: 0 4px;
    }

    .header-subtitle {
      color: rgba(255,255,255,0.75);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .container-main {
      flex: 1;
    }

    /* ── Cards ── */
    .card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: white;
      border: 1px solid #dbeaf2;
      border-radius: 12px;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26,107,138,0.12) !important;
    }

    .card-header {
      border-bottom: none;
      font-weight: 600;
    }

    .card-header.bg-primary  { background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%) !important; }
    .card-header.bg-success  { background: linear-gradient(135deg, #1a6b8a 0%, #24a6c7 100%) !important; }
    .card-header.bg-info     { background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%) !important; }

    /* ── Buttons ── */
    .btn-primary {
      background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
      border: none;
      color: white;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(26,107,138,0.3);
      color: white;
    }

    .btn-success {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border: none;
      color: white;
      transition: all 0.2s ease;
    }

    .btn-success:hover {
      background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(36,166,199,0.3);
      color: white;
    }

    .btn-outline-primary {
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-outline-primary:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* ── Forms ── */
    .form-control:focus,
    .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(36,166,199,0.20);
    }

    /* ── Badges ── */
    .bg-success { background: var(--primary) !important; }
    .bg-primary { background: var(--dark) !important; }
    .bg-info    { background: var(--accent) !important; }

    /* ── Table ── */
    .table-hover tbody tr:hover { background-color: rgba(227,242,249,0.5); }
    .table-light { background-color: var(--light-blue) !important; }
    .bg-light    { background-color: var(--bg) !important; }

    /* ── Misc ── */
    .text-primary { color: var(--primary) !important; }

    code {
      background-color: var(--light-blue);
      color: var(--dark);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .shadow-sm { box-shadow: var(--card-shadow) !important; }

    /* ── Footer ── */
    footer {
      background: #dbeaf2;
      border-top: 2px solid #b3d4e4;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <header class="mb-4">
    <div class="header-content">
      <a href="/" class="header-brand">
        <i class="bi bi-heart-pulse-fill"></i>
        Revy Health Platform
      </a>
      <div class="header-divider"></div>
      <span class="header-subtitle">
        <i class="bi bi-arrow-clockwise me-1"></i>Resubmission Copilot
      </span>
    </div>
  </header>

  <div class="container mb-5 container-main">
    {% block content %}{% endblock %}
  </div>

  <footer class="text-center py-3">
    <small>&copy; 2026 Revy Health Platform. All rights reserved.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
